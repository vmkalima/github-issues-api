name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -v ./...
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
        
      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@latest

      - name: Run gosec
        run: gosec ./...

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Build image
        run: docker build -t github-issues-api .

      - name: Run trivy scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: github-issues-api
          severity: CRITICAL,HIGH
          exit-code: 1
  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-test, lint, security, docker]
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: github-issues-api-ci

      - name: Build image
        run: docker build -t github-issues-api:latest .

      - name: Load image into kind
        run: kind load docker-image github-issues-api:latest --name github-issues-api-ci

      - name: Create namespace secret
        run: |
          kubectl create secret generic github-issues-api-secret \
            --from-literal=API_TOKEN=ci-test-token

      - name: Apply manifests
        run: |
          kubectl apply -f deploy/k8s/deployment.yaml
          kubectl apply -f deploy/k8s/service.yaml

      - name: Wait for rollout
        run: kubectl rollout status deployment/github-issues-api --timeout=90s

      - name: Verify health endpoint
        run: |
          kubectl port-forward svc/github-issues-api-service 8080:80 &
          sleep 5
          curl -f http://localhost:8080/health