apiVersion: apps/v1
kind: Deployment
metadata:
  name: github-issues-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: github-issues-api
  template:
    metadata:
      labels:
        app: github-issues-api
    spec:
      containers:
      - name: github-issues-api
        image: github-issues-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8080
        env:
        - name: API_TOKEN
          valueFrom:
            secretKeyRef:
              name: github-issues-api-secret
              key: API_TOKEN
        resources:
          requests:
            memory: "64Mi"
            cpu: "250m"
          limits:
            memory: "128Mi"
            cpu: "500m"
        securityContext:
          runAsNonRoot: true
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
              - ALL
        livenessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8080
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3